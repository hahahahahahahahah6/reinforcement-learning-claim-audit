[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reinforcement-learning-claim-audit"
version = "0.1.0"
description = "Offline documentation evidence auditor"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
reinforcement-learning-claim-audit = "reinforcement_learning_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["reinforcement_learning_claim_audit*", "tests*"]
